<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificando Correo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <div class="card confirm-card">
      <div id="status-icon" class="icon">⏳</div>
      <h2 id="status-title">Verificando...</h2>
      <p id="status-desc" style="color: #64748b; margin-top: 0.75rem;">
        Por favor espera mientras confirmamos tu cuenta.
      </p>
      <a href="index.html" id="action-btn" class="btn-action" style="display: none;">Ir al Inicio</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://eotxudwqkkuuvqcwfwae.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SHrtbjoYz8UG8jjyafY0yQ_n_VOZHCC';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function verifyUserEmail() {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');

      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const iconEl = document.getElementById('status-icon');
      const btnEl = document.getElementById('action-btn');

      if (!email) {
        iconEl.textContent = '⚠️';
        titleEl.textContent = 'Enlace inválido';
        descEl.textContent = 'No se encontró la dirección de correo a verificar.';
        return;
      }

      try {
        // Actualiza el status en la base de datos
        const { data, error } = await supabase
          .from('users')
          .update({ status: 'verificado' })
          .eq('email', email)
          .select();

        if (error) throw error;

        iconEl.textContent = '✅';
        titleEl.textContent = '¡Correo Confirmado!';
        descEl.textContent = `La cuenta asociada a ${email} ha sido verificada con éxito.`;
      } catch (err) {
        console.error(err);
        iconEl.textContent = '❌';
        titleEl.textContent = 'Error de confirmación';
        descEl.textContent = 'No se pudo actualizar el estado de tu cuenta.';
      } finally {
        btnEl.style.display = 'inline-block';
      }
    }

    document.addEventListener('DOMContentLoaded', verifyUserEmail);
  </script>
</body>
</html>
