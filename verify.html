<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificando Correo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="card confirm-card">
      <div id="status-icon" class="icon">⏳</div>
      <h2 id="status-title">Verificando...</h2>
      <p id="status-desc" style="color: #64748b; margin-top: 0.75rem;">
        Por favor espera mientras confirmamos tu cuenta.
      </p>
      <a href="index.html" id="action-btn" class="btn-action" style="display: none;">Ir al Inicio</a>
    </div>
  </main>

  <script>
    async function verifyUserEmail() {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      const token = params.get('token');

      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const iconEl = document.getElementById('status-icon');
      const btnEl = document.getElementById('action-btn');

      if (!email && !token) {
        iconEl.textContent = '⚠️';
        titleEl.textContent = 'Enlace inválido';
        descEl.textContent = 'No se encontró el parámetro de verificación.';
        return;
      }

      try {
        const query = token ? `token=${encodeURIComponent(token)}` : `email=${encodeURIComponent(email)}`;
        const response = await fetch(`/api/verify?${query}`);
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Error al verificar la cuenta.');
        }

        iconEl.textContent = '✅';
        titleEl.textContent = '¡Correo Confirmado!';
        descEl.textContent = `La cuenta asociada a ${email || 'tu correo'} ha sido verificada con éxito en Aiven.`;
      } catch (err) {
        console.error(err);
        iconEl.textContent = '❌';
        titleEl.textContent = 'Error de confirmación';
        descEl.textContent = err.message || 'No se pudo actualizar el estado de tu cuenta.';
      } finally {
        btnEl.style.display = 'inline-block';
      }
    }

    document.addEventListener('DOMContentLoaded', verifyUserEmail);
  </script>
</body>
</html>
