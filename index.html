<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuarios</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <form id="register-form" class="card" novalidate>
      <h2>Crear Cuenta</h2>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="names">Nombres</label>
          <input type="text" id="names" name="names" required placeholder="Tus nombres">
          <span class="error-message" id="names-error"></span>
        </div>
        <div class="form-group">
          <label for="last_names">Apellidos</label>
          <input type="text" id="last_names" name="last_names" required placeholder="Tus apellidos">
          <span class="error-message" id="last_names-error"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="age">Edad</label>
        <input type="number" id="age" name="age" min="1" max="120" required placeholder="Ej. 20">
        <span class="error-message" id="age-error"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" minlength="6" required placeholder="••••••••">
        <span class="error-message" id="password-error"></span>
      </div>

      <button type="submit" id="submit-btn">Registrarse</button>
      <div id="status-message" class="status-message"></div>
    </form>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
